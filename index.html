<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <style>
    :root {
      --bg: #070814;
      --cyan: #3de7ff;
      --magenta: #ff4ad8;
      --text: #f3fbff;
      --muted: #9bb0c4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(61, 231, 255, 0.16), transparent 55%),
        radial-gradient(ellipse 50% 40% at 80% 90%, rgba(255, 74, 216, 0.12), transparent 50%),
        var(--bg);
      overflow: hidden;
    }

    .grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(61, 231, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(61, 231, 255, 0.08) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 75%);
      pointer-events: none;
    }

    .hud {
      position: fixed;
      top: 1.15rem;
      left: 1.15rem;
      right: 1.15rem;
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--cyan);
      opacity: 0.75;
      z-index: 2;
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 2rem;
      text-align: center;
    }

    .title {
      font-weight: 800;
      font-size: clamp(2.6rem, 11vw, 6.4rem);
      line-height: 0.95;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 18px rgba(61, 231, 255, 0.45);
    }

    .lead {
      margin: 1.2rem 0 1.8rem;
      font-size: clamp(1rem, 2.2vw, 1.15rem);
      color: var(--muted);
    }

    .cta {
      appearance: none;
      border: 1px solid rgba(61, 231, 255, 0.5);
      background: rgba(61, 231, 255, 0.1);
      color: var(--text);
      font: inherit;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.9rem 1.4rem;
      border-radius: 999px;
      cursor: pointer;
    }

    .cta:hover,
    .cta:focus-visible {
      border-color: var(--magenta);
      outline: none;
    }

    .spark {
      position: fixed;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      pointer-events: none;
      z-index: 3;
      animation: spark 520ms ease-out forwards;
    }

    .spark.alt {
      background: var(--magenta);
    }

    @keyframes spark {
      to {
        transform: translate(var(--dx), var(--dy));
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spark {
        animation: none;
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <div class="hud">
    <span>NEON / SIGNAL</span>
    <span id="clock">00:00:00</span>
  </div>
  <main>
    <div>
      <h1 class="title">Hello World</h1>
      <p class="lead">轻量霓虹启动页——点击仍有火花，但不再拖慢页面。</p>
      <button class="cta" id="burst" type="button">点亮 Hello World</button>
    </div>
  </main>
  <script>
    const clock = document.getElementById("clock");
    const burst = document.getElementById("burst");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const MAX_SPARKS = 18;

    function updateClock() {
      clock.textContent = new Date().toLocaleTimeString("zh-CN", { hour12: false });
    }

    function burstAt(x, y, count) {
      if (reduceMotion) return;
      const existing = document.getElementsByClassName("spark").length;
      const allowed = Math.max(0, MAX_SPARKS - existing);
      const n = Math.min(count, allowed);
      const frag = document.createDocumentFragment();
      for (let i = 0; i < n; i += 1) {
        const spark = document.createElement("span");
        const angle = (Math.PI * 2 * i) / n;
        const dist = 48 + (i % 3) * 22;
        spark.className = i % 2 ? "spark alt" : "spark";
        spark.style.left = x + "px";
        spark.style.top = y + "px";
        spark.style.setProperty("--dx", Math.cos(angle) * dist + "px");
        spark.style.setProperty("--dy", Math.sin(angle) * dist + "px");
        spark.addEventListener("animationend", () => spark.remove(), { once: true });
        frag.appendChild(spark);
      }
      document.body.appendChild(frag);
    }

    burst.addEventListener("click", (event) => {
      burstAt(event.clientX, event.clientY, 12);
    });

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
