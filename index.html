<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2b2e;
      --muted: #3d5559;
      --accent: #0f7a6c;
      --accent-soft: rgba(15, 122, 108, 0.12);
      --glow-a: #b8e0d8;
      --glow-b: #f3d9b0;
      --surface: rgba(255, 255, 255, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Source Sans 3", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 60% at 20% 20%, var(--glow-a) 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 85% 75%, var(--glow-b) 0%, transparent 50%),
        linear-gradient(160deg, #e8f4f2 0%, #f7f0e6 48%, #eef6f4 100%);
      display: grid;
      place-items: center;
      padding: 2rem;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(26, 43, 46, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26, 43, 46, 0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 20%, transparent 75%);
      pointer-events: none;
      animation: drift 18s ease-in-out infinite alternate;
    }

    main {
      position: relative;
      text-align: center;
      max-width: 40rem;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .brand {
      font-family: "Fraunces", serif;
      font-optical-sizing: auto;
      font-weight: 700;
      font-size: clamp(3.5rem, 12vw, 7rem);
      line-height: 0.95;
      letter-spacing: -0.03em;
      color: var(--ink);
      margin-bottom: 1.25rem;
    }

    .brand span {
      display: inline-block;
      background: linear-gradient(120deg, var(--ink) 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: reveal 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
    }

    .lead {
      font-size: clamp(1.05rem, 2.4vw, 1.25rem);
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 2rem;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.25s both;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.4rem;
      border: none;
      border-radius: 0.35rem;
      background: var(--accent);
      color: #f7fffd;
      font: inherit;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.4s both;
    }

    .cta:hover {
      transform: translateY(-2px);
      background: #0c6559;
    }

    .cta:focus-visible {
      outline: 3px solid var(--accent-soft);
      outline-offset: 3px;
    }

    .orb {
      position: fixed;
      width: min(42vw, 22rem);
      height: min(42vw, 22rem);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.55), transparent 55%),
        radial-gradient(circle at 70% 70%, rgba(15, 122, 108, 0.18), transparent 60%);
      filter: blur(2px);
      z-index: -1;
      animation: float 8s ease-in-out infinite;
    }

    .orb-a {
      top: 12%;
      right: 10%;
    }

    .orb-b {
      bottom: 8%;
      left: 8%;
      animation-delay: -3s;
      width: min(30vw, 14rem);
      height: min(30vw, 14rem);
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.98);
        filter: blur(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }

    @keyframes drift {
      from { transform: translate(0, 0); }
      to { transform: translate(-12px, 8px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="orb orb-a" aria-hidden="true"></div>
  <div class="orb orb-b" aria-hidden="true"></div>
  <main>
    <h1 class="brand"><span>Hello World</span></h1>
    <p class="lead">一个简洁的起始页——欢迎来到这个小小的网页。</p>
    <a class="cta" href="#hello" id="hello">开始探索</a>
  </main>
</body>
</html>
