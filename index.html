<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Noto+Sans+SC:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #05060c;
      --cyan: #00f6ff;
      --magenta: #ff2bd6;
      --lime: #b8ff3c;
      --text: #e8f7ff;
      --muted: #8aa4b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "Noto Sans SC", sans-serif;
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
      cursor: none;
    }

    canvas#field {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .scanlines,
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .scanlines {
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 2px,
        rgba(0, 0, 0, 0.18) 2px,
        rgba(0, 0, 0, 0.18) 3px
      );
      mix-blend-mode: multiply;
      opacity: 0.45;
    }

    .vignette {
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.72) 100%);
    }

    .hud {
      position: fixed;
      top: 1.25rem;
      left: 1.25rem;
      right: 1.25rem;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--cyan);
      opacity: 0.8;
    }

    main {
      position: relative;
      z-index: 3;
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 2rem;
      text-align: center;
    }

    .stage {
      max-width: 56rem;
    }

    .glitch {
      position: relative;
      font-family: "Orbitron", sans-serif;
      font-weight: 800;
      font-size: clamp(2.4rem, 11vw, 7.2rem);
      line-height: 0.92;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
      text-shadow:
        0 0 12px rgba(0, 246, 255, 0.7),
        0 0 42px rgba(255, 43, 214, 0.35);
      animation: enter 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .glitch::before,
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      mix-blend-mode: screen;
    }

    .glitch::before {
      color: var(--cyan);
      transform: translate(-3px, 1px);
      animation: jitter-a 2.4s infinite linear;
    }

    .glitch::after {
      color: var(--magenta);
      transform: translate(3px, -1px);
      animation: jitter-b 1.8s infinite linear;
    }

    .lead {
      margin: 1.4rem 0 2rem;
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      color: var(--muted);
      animation: enter 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
    }

    .cta {
      appearance: none;
      border: 1px solid rgba(0, 246, 255, 0.55);
      background: linear-gradient(180deg, rgba(0, 246, 255, 0.16), rgba(255, 43, 214, 0.08));
      color: var(--text);
      font: inherit;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 0.95rem 1.5rem;
      border-radius: 999px;
      cursor: none;
      box-shadow: 0 0 24px rgba(0, 246, 255, 0.18);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      animation: enter 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.28s both;
    }

    .cta:hover,
    .cta:focus-visible {
      transform: translateY(-2px) scale(1.03);
      border-color: var(--lime);
      box-shadow: 0 0 36px rgba(184, 255, 60, 0.28);
      outline: none;
    }

    .cursor {
      position: fixed;
      width: 18px;
      height: 18px;
      border: 2px solid var(--cyan);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 16px var(--cyan);
      mix-blend-mode: screen;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(22px) scale(0.96);
        filter: blur(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes jitter-a {
      0%, 86%, 100% { clip-path: inset(0 0 0 0); }
      88% { clip-path: inset(12% 0 58% 0); }
      92% { clip-path: inset(40% 0 20% 0); }
    }

    @keyframes jitter-b {
      0%, 80%, 100% { clip-path: inset(0 0 0 0); }
      83% { clip-path: inset(60% 0 8% 0); }
      90% { clip-path: inset(18% 0 45% 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }

      body {
        cursor: auto;
      }

      .cursor {
        display: none;
      }
    }
  </style>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="cursor" id="cursor" aria-hidden="true"></div>
  <div class="hud">
    <span>NEON / SIGNAL</span>
    <span id="clock">00:00:00</span>
  </div>
  <main>
    <div class="stage">
      <h1 class="glitch" data-text="Hello World">Hello World</h1>
      <p class="lead">深空霓虹启动页——点击引爆粒子风暴。</p>
      <button class="cta" id="burst" type="button">引爆 Hello World</button>
    </div>
  </main>
  <script>
    const canvas = document.getElementById("field");
    const ctx = canvas.getContext("2d");
    const cursor = document.getElementById("cursor");
    const clock = document.getElementById("clock");
    const burstBtn = document.getElementById("burst");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let width = 0;
    let height = 0;
    let particles = [];
    let mouse = { x: innerWidth / 2, y: innerHeight / 2 };

    function resize() {
      width = canvas.width = innerWidth * devicePixelRatio;
      height = canvas.height = innerHeight * devicePixelRatio;
      canvas.style.width = innerWidth + "px";
      canvas.style.height = innerHeight + "px";
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }

    function spawn(count, explode) {
      for (let i = 0; i < count; i += 1) {
        const angle = Math.random() * Math.PI * 2;
        const speed = explode ? 2 + Math.random() * 8 : 0.15 + Math.random() * 0.7;
        particles.push({
          x: explode ? mouse.x : Math.random() * innerWidth,
          y: explode ? mouse.y : Math.random() * innerHeight,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: explode ? 1.4 + Math.random() * 2.4 : 0.6 + Math.random() * 1.6,
          life: explode ? 90 + Math.random() * 40 : 240 + Math.random() * 180,
          hue: Math.random() > 0.55 ? 188 : 318
        });
      }
    }

    function drawGrid() {
      const horizon = innerHeight * 0.62;
      ctx.strokeStyle = "rgba(0, 246, 255, 0.12)";
      ctx.lineWidth = 1;
      for (let i = 0; i < 18; i += 1) {
        const y = horizon + i * i * 2.2;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(innerWidth, y);
        ctx.stroke();
      }
      for (let i = -20; i <= 20; i += 1) {
        ctx.beginPath();
        ctx.moveTo(innerWidth / 2 + i * 48, innerHeight);
        ctx.lineTo(innerWidth / 2 + i * 18, horizon);
        ctx.stroke();
      }
    }

    function tick() {
      ctx.fillStyle = "rgba(5, 6, 12, 0.28)";
      ctx.fillRect(0, 0, innerWidth, innerHeight);
      drawGrid();

      particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.992;
        p.vy *= 0.992;
        p.life -= 1;
        ctx.beginPath();
        ctx.fillStyle = `hsla(${p.hue}, 100%, 62%, ${Math.max(p.life / 180, 0)})`;
        ctx.shadowColor = `hsla(${p.hue}, 100%, 60%, 0.8)`;
        ctx.shadowBlur = 12;
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      });
      particles = particles.filter((p) => p.life > 0);
      if (particles.length < 90) spawn(4, false);
      requestAnimationFrame(tick);
    }

    function updateClock() {
      clock.textContent = new Date().toLocaleTimeString("zh-CN", { hour12: false });
    }

    window.addEventListener("resize", resize);
    window.addEventListener("pointermove", (event) => {
      mouse.x = event.clientX;
      mouse.y = event.clientY;
      cursor.style.left = event.clientX + "px";
      cursor.style.top = event.clientY + "px";
    });
    window.addEventListener("pointerdown", () => spawn(48, true));
    burstBtn.addEventListener("click", () => {
      mouse.x = innerWidth / 2;
      mouse.y = innerHeight * 0.42;
      spawn(120, true);
    });

    resize();
    updateClock();
    setInterval(updateClock, 1000);
    if (!reduceMotion) {
      spawn(120, false);
      tick();
    } else {
      ctx.fillStyle = "#05060c";
      ctx.fillRect(0, 0, innerWidth, innerHeight);
      drawGrid();
    }
  </script>
</body>
</html>
