<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <style>
    :root {
      --bg: #05060f;
      --cyan: #3de7ff;
      --magenta: #ff4ad8;
      --text: #f4fbff;
      --muted: #9bb3c7;
      --px: 0;
      --py: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    .aurora,
    .sun,
    .floor-wrap,
    canvas#fx,
    .ring,
    .cursor-glow,
    .cursor-dot {
      pointer-events: none;
    }

    .aurora {
      position: fixed;
      width: 55vw;
      height: 55vw;
      border-radius: 50%;
      opacity: 0.55;
      will-change: transform;
    }

    .aurora-a {
      top: -12%;
      left: -8%;
      background: radial-gradient(circle at 40% 40%, rgba(61, 231, 255, 0.55), transparent 62%);
      animation: drift-a 14s ease-in-out infinite alternate;
    }

    .aurora-b {
      right: -10%;
      bottom: 8%;
      width: 48vw;
      height: 48vw;
      background: radial-gradient(circle at 50% 50%, rgba(255, 74, 216, 0.42), transparent 64%);
      animation: drift-b 18s ease-in-out infinite alternate;
    }

    .sun {
      position: fixed;
      left: 50%;
      bottom: 34%;
      width: min(48vw, 26rem);
      height: min(48vw, 26rem);
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(255, 214, 120, 0.7) 0%, rgba(255, 74, 216, 0.28) 38%, transparent 70%);
    }

    .floor-wrap {
      position: fixed;
      inset: 48% 0 0;
      perspective: 420px;
    }

    .floor {
      height: 220%;
      background-image:
        linear-gradient(rgba(61, 231, 255, 0.42) 1px, transparent 1px),
        linear-gradient(90deg, rgba(61, 231, 255, 0.38) 1px, transparent 1px);
      background-size: 56px 56px;
      transform: rotateX(66deg);
      transform-origin: center top;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.95), transparent 88%);
      animation: rush 7s linear infinite;
      will-change: transform;
    }

    canvas#fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .hud {
      position: fixed;
      top: 1.15rem;
      left: 1.15rem;
      right: 1.15rem;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--cyan);
      opacity: 0.8;
    }

    .hud span {
      transition: color 0.18s ease, text-shadow 0.18s ease;
    }

    .hud span:hover {
      color: var(--magenta);
      text-shadow: 0 0 12px rgba(255, 74, 216, 0.7);
    }

    main {
      position: relative;
      z-index: 2;
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem 18vh;
      text-align: center;
    }

    .stage {
      transform: translate3d(calc(var(--px) * 10px), calc(var(--py) * 8px), 0);
      will-change: transform;
    }

    .title {
      position: relative;
      font-weight: 800;
      font-size: clamp(2.5rem, 11vw, 6.6rem);
      line-height: 0.92;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 22px rgba(61, 231, 255, 0.4);
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .title::before,
    .title::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      opacity: 0.38;
      pointer-events: none;
    }

    .title::before {
      color: var(--cyan);
      transform: translate(-2px, 0);
    }

    .title::after {
      color: var(--magenta);
      transform: translate(2px, 0);
    }

    .title span {
      position: relative;
      z-index: 1;
      display: inline-block;
      transition: transform 0.16s ease, color 0.16s ease, text-shadow 0.16s ease;
    }

    .title span.is-space {
      width: 0.35em;
    }

    .title span:hover {
      color: var(--cyan);
      transform: translateY(-12px) scale(1.12);
      text-shadow: 0 0 18px rgba(61, 231, 255, 0.85);
    }

    .lead {
      margin: 1.15rem 0 1.7rem;
      color: var(--muted);
      font-size: clamp(1rem, 2.2vw, 1.15rem);
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both;
      transition: color 0.18s ease, text-shadow 0.18s ease;
    }

    .lead:hover {
      color: var(--text);
      text-shadow: 0 0 14px rgba(61, 231, 255, 0.35);
    }

    .cta {
      appearance: none;
      border: 1px solid rgba(61, 231, 255, 0.55);
      background: rgba(61, 231, 255, 0.1);
      color: var(--text);
      font: inherit;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.9rem 1.45rem;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(61, 231, 255, 0.16);
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .cta:hover,
    .cta:focus-visible {
      transform: translateY(-3px) scale(1.05);
      border-color: var(--magenta);
      background: rgba(255, 74, 216, 0.16);
      box-shadow: 0 0 28px rgba(255, 74, 216, 0.35);
      outline: none;
    }

    .ring {
      position: fixed;
      width: 18px;
      height: 18px;
      border: 2px solid var(--cyan);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0.4);
      opacity: 0;
      z-index: 4;
    }

    .ring.on {
      animation: shock 620ms ease-out forwards;
    }

    .cursor-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 160px;
      height: 160px;
      margin: -80px 0 0 -80px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(61, 231, 255, 0.3), transparent 68%);
      z-index: 5;
      will-change: transform;
    }

    .cursor-glow.hot {
      background: radial-gradient(circle, rgba(255, 74, 216, 0.36), rgba(61, 231, 255, 0.16) 46%, transparent 70%);
    }

    .cursor-dot {
      position: fixed;
      top: 0;
      left: 0;
      width: 8px;
      height: 8px;
      margin: -4px 0 0 -4px;
      border-radius: 50%;
      background: var(--cyan);
      z-index: 5;
      will-change: transform;
    }

    .cursor-dot:nth-child(odd) {
      background: var(--magenta);
    }

    @keyframes drift-a {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(4vw, 3vh, 0); }
    }

    @keyframes drift-b {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-5vw, -2vh, 0); }
    }

    @keyframes rush {
      from { transform: rotateX(66deg) translate3d(0, 0, 0); }
      to { transform: rotateX(66deg) translate3d(0, 64px, 0); }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translate3d(0, 16px, 0);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes shock {
      to {
        transform: translate(-50%, -50%) scale(14);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .aurora,
      .floor,
      .title,
      .lead,
      .cta,
      .ring {
        animation: none !important;
      }

      .cursor-glow,
      .cursor-dot {
        display: none;
      }

      .title span:hover,
      .cta:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="aurora aurora-a" aria-hidden="true"></div>
  <div class="aurora aurora-b" aria-hidden="true"></div>
  <div class="sun" aria-hidden="true"></div>
  <div class="floor-wrap" aria-hidden="true"><div class="floor"></div></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="ring" id="ring" aria-hidden="true"></div>
  <div class="cursor-glow" id="glow" aria-hidden="true"></div>
  <div id="trail" aria-hidden="true"></div>
  <div class="hud">
    <span>NEON / SIGNAL</span>
    <span id="clock">00:00:00</span>
  </div>
  <main>
    <div class="stage" id="stage">
      <h1 class="title" id="title" data-text="Hello World" aria-label="Hello World"></h1>
      <p class="lead">移动、悬停、点击任意位置，频道都会回应。</p>
      <button class="cta" id="burst" type="button">释放脉冲</button>
    </div>
  </main>
  <script>
    const canvas = document.getElementById("fx");
    const ctx = canvas.getContext("2d", { alpha: true, desynchronized: true });
    const stage = document.getElementById("stage");
    const title = document.getElementById("title");
    const glow = document.getElementById("glow");
    const trailRoot = document.getElementById("trail");
    const ring = document.getElementById("ring");
    const clock = document.getElementById("clock");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    title.replaceChildren(
      ..."Hello World".split("").map((char) => {
        const span = document.createElement("span");
        if (char === " ") {
          span.className = "is-space";
          span.innerHTML = "&nbsp;";
        } else {
          span.textContent = char;
        }
        return span;
      })
    );

    const TRAIL = 6;
    const trail = [];
    for (let i = 0; i < TRAIL; i += 1) {
      const el = document.createElement("div");
      el.className = "cursor-dot";
      trailRoot.appendChild(el);
      trail.push({ el, x: innerWidth / 2, y: innerHeight / 2 });
    }

    const MAX = 64;
    const CYAN = "rgba(61, 231, 255, 0.9)";
    const MAGENTA = "rgba(255, 74, 216, 0.9)";
    const particles = new Array(MAX);
    const mouse = { x: innerWidth / 2, y: innerHeight / 2 };
    let width = 0;
    let height = 0;
    let stars = null;
    let running = !reduceMotion;
    let glowX = mouse.x;
    let glowY = mouse.y;
    let px = 0;
    let py = 0;
    let parallaxDirty = false;
    let lastTrailSpawn = 0;

    function makeParticle() {
      return { x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 0, cyan: true, size: 2 };
    }

    for (let i = 0; i < MAX; i += 1) particles[i] = makeParticle();

    function grab() {
      for (let i = 0; i < MAX; i += 1) {
        if (particles[i].life <= 0) return particles[i];
      }
      return null;
    }

    function spawn(x, y, count, explode) {
      for (let i = 0; i < count; i += 1) {
        const p = grab();
        if (!p) return;
        const angle = Math.random() * Math.PI * 2;
        const speed = explode ? 1.6 + Math.random() * 3.4 : 0.12 + Math.random() * 0.35;
        p.x = explode ? x : Math.random() * width;
        p.y = explode ? y : Math.random() * height;
        p.vx = Math.cos(angle) * speed;
        p.vy = Math.sin(angle) * speed;
        p.max = explode ? 36 + (i % 10) : 180;
        p.life = p.max;
        p.cyan = i % 2 === 0;
        p.size = explode ? 3 : 2;
      }
    }

    function spawnTrail(x, y) {
      const p = grab();
      if (!p) return;
      p.x = x;
      p.y = y;
      p.vx = (Math.random() - 0.5) * 0.4;
      p.vy = (Math.random() - 0.5) * 0.4;
      p.max = 18;
      p.life = 18;
      p.cyan = Math.random() > 0.5;
      p.size = 2;
    }

    function buildStars() {
      stars = document.createElement("canvas");
      stars.width = width;
      stars.height = height;
      const sctx = stars.getContext("2d");
      const count = Math.min(110, Math.floor(width * height / 14000));
      for (let i = 0; i < count; i += 1) {
        sctx.fillStyle = i % 5 === 0 ? "rgba(255, 74, 216, 0.7)" : "rgba(230, 248, 255, 0.7)";
        sctx.fillRect((Math.random() * width) | 0, (Math.random() * height) | 0, 1, 1);
      }
    }

    function resize() {
      width = canvas.width = innerWidth;
      height = canvas.height = innerHeight;
      canvas.style.width = innerWidth + "px";
      canvas.style.height = innerHeight + "px";
      buildStars();
    }

    function tick(now) {
      if (!running) return;
      glowX += (mouse.x - glowX) * 0.28;
      glowY += (mouse.y - glowY) * 0.28;
      glow.style.transform = "translate3d(" + glowX + "px," + glowY + "px,0)";

      let tx = glowX;
      let ty = glowY;
      for (let i = 0; i < TRAIL; i += 1) {
        const dot = trail[i];
        dot.x += (tx - dot.x) * (0.34 - i * 0.03);
        dot.y += (ty - dot.y) * (0.34 - i * 0.03);
        const scale = 1 - i * 0.12;
        dot.el.style.transform = "translate3d(" + dot.x + "px," + dot.y + "px,0) scale(" + scale + ")";
        dot.el.style.opacity = String(0.7 - i * 0.09);
        tx = dot.x;
        ty = dot.y;
      }

      if (parallaxDirty) {
        stage.style.setProperty("--px", px);
        stage.style.setProperty("--py", py);
        parallaxDirty = false;
      }

      ctx.clearRect(0, 0, width, height);
      if (stars) ctx.drawImage(stars, 0, 0);

      for (let i = 0; i < MAX; i += 1) {
        const p = particles[i];
        if (p.life <= 0) continue;
        p.x += p.vx + (mouse.x - p.x) * 0.0008;
        p.y += p.vy + (mouse.y - p.y) * 0.0008;
        p.life -= 1;
      }

      ctx.fillStyle = CYAN;
      for (let i = 0; i < MAX; i += 1) {
        const p = particles[i];
        if (p.life <= 0 || !p.cyan) continue;
        ctx.globalAlpha = p.life / p.max;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
      ctx.fillStyle = MAGENTA;
      for (let i = 0; i < MAX; i += 1) {
        const p = particles[i];
        if (p.life <= 0 || p.cyan) continue;
        ctx.globalAlpha = p.life / p.max;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(tick);
    }

    function pulse(x, y) {
      ring.style.left = x + "px";
      ring.style.top = y + "px";
      ring.classList.remove("on");
      void ring.offsetWidth;
      ring.classList.add("on");
      if (!reduceMotion) spawn(x, y, 20, true);
    }

    function isHotTarget(node) {
      return Boolean(node && node.closest && node.closest(".title, .cta, .lead, .hud"));
    }

    window.addEventListener("resize", resize, { passive: true });
    window.addEventListener("pointermove", (event) => {
      mouse.x = event.clientX;
      mouse.y = event.clientY;
      px = (event.clientX / innerWidth - 0.5).toFixed(3);
      py = (event.clientY / innerHeight - 0.5).toFixed(3);
      parallaxDirty = true;
      glow.classList.toggle("hot", isHotTarget(event.target));
      const now = performance.now();
      if (!reduceMotion && now - lastTrailSpawn > 32) {
        spawnTrail(event.clientX, event.clientY);
        lastTrailSpawn = now;
      }
    }, { passive: true });
    window.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;
      pulse(event.clientX, event.clientY);
    });
    document.addEventListener("selectstart", (event) => event.preventDefault());
    document.addEventListener("dblclick", (event) => event.preventDefault());
    document.addEventListener("visibilitychange", () => {
      const shouldRun = !document.hidden && !reduceMotion;
      if (shouldRun && !running) {
        running = true;
        requestAnimationFrame(tick);
      } else if (document.hidden) {
        running = false;
      }
    });

    function updateClock() {
      clock.textContent = new Date().toLocaleTimeString("zh-CN", { hour12: false });
    }

    resize();
    updateClock();
    setInterval(updateClock, 1000);
    if (!reduceMotion) {
      spawn(width / 2, height / 2, 36, false);
      requestAnimationFrame(tick);
    } else if (stars) {
      ctx.drawImage(stars, 0, 0);
    }
  </script>
</body>
</html>
